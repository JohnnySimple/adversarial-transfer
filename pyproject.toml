[project]
name = "advtransfer"
version = "0.1.0"
description = "When do adversarial examples transfer between models? A measurement study on MNIST."
authors = [{ name = "Johnson Boateng Obeng" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "matplotlib>=3.9,<4",
]

[project.scripts]
advtransfer = "advtransfer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs",
    "scipy-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advtransfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not expensive'"
markers = [
    "slow: requires model training or full attack runs",
    "expensive: multi-minute runs excluded by default; run with -m expensive",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.mypy]
python_version = "3.11"
packages = ["advtransfer"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torchvision.*", "matplotlib.*"]
ignore_missing_imports = true
